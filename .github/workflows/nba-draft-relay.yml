name: NBA draft relay

on:
  workflow_dispatch:
    inputs:
      skip_espn:
        description: "omitir noticias/rosters/historial de ESPN (más rápido)"
        type: boolean
        default: false
  schedule:
    - cron: "0 13 * * *"    # 8:00 AM de Panamá (UTC-5): lesiones, noticias, proyecciones
    - cron: "30 22 * * *"   # 5:30 PM de Panamá: igual, y mueve la línea base del reporte de 24 h

permissions:
  contents: write

concurrency:
  group: nba-draft-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Snapshot de datos (Sleeper + ESPN) a docs/nba-draft/data
        env:
          # solo la corrida de las 5:30 PM mueve la línea base del reporte de lesiones (diff de 24 h);
          # la de las 8:00 AM muestra lo nuevo desde la tarde anterior sin moverla
          RELAY_BASELINE: ${{ github.event.schedule == '30 22 * * *' && '1' || '' }}
        run: |
          python docs/nba-draft/relay/relay.py snapshot --push ${{ inputs.skip_espn == true && '--skip-espn' || '' }}
