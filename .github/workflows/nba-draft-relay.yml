name: NBA draft relay

on:
  workflow_dispatch:
    inputs:
      skip_espn:
        description: "omitir noticias/rosters/historial de ESPN (más rápido)"
        type: boolean
        default: false
  schedule:
    - cron: "0 21 * * *"   # snapshot diario a las 4:00 PM de Panamá (UTC-5): lesiones, noticias, proyecciones

permissions:
  contents: write

concurrency:
  group: nba-draft-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Snapshot de datos (Sleeper + ESPN) a docs/nba-draft/data
        env:
          # solo la corrida programada mueve la línea base del reporte de lesiones (diff de 24 h)
          RELAY_BASELINE: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: |
          python docs/nba-draft/relay/relay.py snapshot --push ${{ inputs.skip_espn == true && '--skip-espn' || '' }}
