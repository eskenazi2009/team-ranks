name: NBA draft relay

on:
  workflow_dispatch:
    inputs:
      skip_espn:
        description: "omitir noticias/rosters/historial de ESPN (más rápido)"
        type: boolean
        default: false
      baseline:
        description: "cerrar el reporte de 24 h (corrida de la tarde)"
        type: boolean
        default: false
  schedule:
    # Respaldo: GitHub retrasa los crons por horas. El disparo puntual lo hacen dos tareas programadas de
    # Claude (7:57 AM y 5:27 PM de Panamá) con workflow_dispatch; la de la tarde manda baseline=true.
    - cron: "0 13 * * *"    # 8:00 AM de Panamá (UTC-5)
    - cron: "30 22 * * *"   # 5:30 PM de Panamá: también cierra el reporte de 24 h

permissions:
  contents: write

concurrency:
  group: nba-draft-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Snapshot de datos (Sleeper + ESPN) a docs/nba-draft/data
        env:
          # la corrida de la tarde (cron de las 22:30 o disparo con baseline=true) cierra el reporte de 24 h;
          # el relay no la mueve si tiene menos de 6 h, así un cron atrasado no la mueve dos veces
          RELAY_BASELINE: ${{ (github.event.schedule == '30 22 * * *' || inputs.baseline == true) && '1' || '' }}
        run: |
          python docs/nba-draft/relay/relay.py snapshot --push ${{ inputs.skip_espn == true && '--skip-espn' || '' }}
